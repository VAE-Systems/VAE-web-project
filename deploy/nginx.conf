server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Content Security Policy
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    application/wasm
    image/svg+xml
    font/woff2;

  # Brotli Compression (if available)
  brotli on;
  brotli_comp_level 6;
  brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml
    font/woff2;

  # Cache static assets with immutable hint
  location ~* \.(js|css|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Cache images/media
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 6M;
    add_header Cache-Control "public, max-age=15552000";
  }

  # Early hints for fonts (HTTP/2 Push alternative)
  location = /fonts/geist/Geist-Variable.woff2 {
    add_header Link "</fonts/geist/Geist-Variable.woff2>; rel=preload; as=font; crossorigin" always;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
