<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/App_Logo_light.svg" aria-label="VAE Systems Logo" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical Performance Optimizations -->
    <link rel="preload" href="/fonts/inter/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="//fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="//fonts.gstatic.com" crossorigin />

    <!-- Enhanced SEO Meta Tags -->
    <meta
      name="description"
      content="VAE Systems - DSGVO-konforme KI-Automatisierung und Workflow-Engines für deutsche Unternehmen. Open Source, lokal gehostet, ohne Vendor Lock-in."
    />
    <meta
      name="keywords"
      content="VAE Systems, KI-Automatisierung, DSGVO-konform, Open Source AI, Workflow-Engine, Local Hosting, Docker, Kubernetes, Machine Learning Deutschland"
    />
    <meta name="author" content="VAE Systems" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VAE Systems - DSGVO-konforme KI-Automatisierung" />
    <meta
      property="og:description"
      content="Innovative KI-Lösungen und Workflow-Automation für deutsche Unternehmen. 100% Open Source, lokal gehostet, datenschutzkonform."
    />
    <meta property="og:url" content="https://vae-systems.com" />
    <meta property="og:site_name" content="VAE Systems" />
    <meta property="og:image" content="https://vae-systems.com/App_Logo_light.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VAE Systems - DSGVO-konforme KI-Automatisierung" />
    <meta
      name="twitter:description"
      content="Innovative KI-Lösungen für deutsche Unternehmen. Open Source, lokal, datenschutzkonform."
    />
    <meta name="twitter:image" content="https://vae-systems.com/App_Logo_light.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VAE Systems",
        "description": "DSGVO-konforme KI-Automatisierung und Workflow-Engines für deutsche Unternehmen",
        "url": "https://vae-systems.com",
        "logo": "https://vae-systems.com/App_Logo_light.svg",
        "foundingDate": "2024",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "DE"
        },
        "sameAs": ["https://github.com/VAE-Systems"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["German", "English"]
        }
      }
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#00ffa5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VAE Systems" />
    <link rel="apple-touch-icon" href="/App_Logo_light.svg" aria-label="VAE Systems Logo" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vae.systems/" />
    <meta property="og:title" content="VAE Systems - Innovative KI-Lösungen" />
    <meta
      property="og:description"
      content="VAE Systems - Innovative KI-Lösungen und Automatisierung für die Zukunft"
    />
    <meta property="og:image" content="https://vae.systems/App_Logo_light.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vae.systems/" />
    <meta property="twitter:title" content="VAE Systems - Innovative KI-Lösungen" />
    <meta
      property="twitter:description"
      content="VAE Systems - Innovative KI-Lösungen und Automatisierung für die Zukunft"
    />
    <meta property="twitter:image" content="https://vae.systems/App_Logo_light.svg" />

    <!-- All icons rendered via lucide-react; no external webfonts needed -->
    <!-- Inter wird lokal gehostet via @font-face in globals.css (kein externes CDN) -->
    <!-- Optional Preload: wird wirksam, sobald die Datei in /public/fonts/inter liegt -->
    <link rel="preload" href="/fonts/inter/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <title>VAE Systems - Innovative KI-Lösungen</title>
  </head>

  <body>
    <a href="#root" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
