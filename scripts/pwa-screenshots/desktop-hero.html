<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAE Systems – Desktop Hero Screenshot</title>
  <link rel="stylesheet" href="../../VAE-Machine/_templates/shared/digital-base.css">
  <style>
    :root {
      --bg-deep: #050806;
      --vae-turquoise: #00ffa5;
      --text-dim: rgba(255, 255, 255, 0.75);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at 30% 20%, #0d1f16 0%, var(--bg-deep) 50%);
      color: white;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .screenshot {
      width: 1280px;
      height: 720px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }
    
    .glow-orb {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,255,165,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 32px;
    }
    
    .headline {
      font-size: 56px;
      font-weight: 600;
      text-align: center;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    
    .headline .highlight {
      color: var(--vae-turquoise);
      text-shadow: 0 0 40px rgba(0,255,165,0.4);
    }
    
    .subline {
      font-size: 22px;
      color: var(--text-dim);
      text-align: center;
      max-width: 700px;
      line-height: 1.5;
      margin-bottom: 40px;
    }
    
    .cta-row {
      display: flex;
      gap: 16px;
    }
    
    .btn {
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    
    .btn-primary {
      background: var(--vae-turquoise);
      color: #050806;
      box-shadow: 0 0 30px rgba(0,255,165,0.3);
    }
    
    .btn-secondary {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .footer-bar {
      position: absolute;
      bottom: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-dim);
    }
    
    .footer-bar .domain {
      font-family: 'Geist Mono', monospace;
      letter-spacing: 0.05em;
    }
    
    .services-row {
      display: flex;
      gap: 24px;
    }
    
    .service-tag {
      padding: 8px 16px;
      border: 1px solid rgba(0,255,165,0.3);
      border-radius: 100px;
      font-size: 13px;
      color: var(--vae-turquoise);
      background: rgba(0,255,165,0.05);
    }
  </style>
</head>
<body>
  <div class="screenshot">
    <div class="glow-orb"></div>
    
    <img src="../../public/App_Logo_light.svg" alt="VAE Systems" class="logo">
    
    <h1 class="headline">
      Self-Hosted Infrastruktur.<br>
      <span class="highlight">KI-Ready.</span>
    </h1>
    
    <p class="subline">
      Wir bauen, optimieren und betreuen digitale Arbeitsinfrastruktur — 
      Open Source, DSGVO-konform, ohne Vendor-Lock-in.
    </p>
    
    <div class="cta-row">
      <button class="btn btn-primary">Erstgespräch buchen</button>
      <button class="btn btn-secondary">Leistungen ansehen</button>
    </div>
    
    <div class="footer-bar">
      <div class="services-row">
        <span class="service-tag">Strategieberatung</span>
        <span class="service-tag">Infrastruktur-Setup</span>
        <span class="service-tag">Managed Services</span>
      </div>
      <span class="domain">vae-systems.com</span>
    </div>
  </div>
</body>
</html>
